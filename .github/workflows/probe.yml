name: probe
on:
  push:
    branches: [ "claude/tmp-probe" ]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: fetch
        run: |
          UA="Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/129 Mobile Safari/537.36"
          get() { curl -sS -A "$UA" -H "Referer: https://www.investorgain.com/" -H "Accept: application/json" "$1"; }
          curl -sS -A "$UA" "https://www.investorgain.com/gmp/tonbo-imaging-india-ipo/2369/" > page.html
          curl -sS -A "$UA" "https://www.investorgain.com/gmp/acme-india-industries-ipo/2006/" > sme.html
          python3 - <<'PY'
          import re,json
          def note(t): print("::notice::"+t.replace("\n"," ")[:3900])
          for f in ["page.html","sme.html"]:
              h=open(f).read().replace('\\"','"')
              infos=sorted(set(re.findall(r'"([a-zA-Z_]{3,40})":\[\{',h)))
              note(f+" arrays="+",".join(infos))
              for kw in ['"leadManager','"lead_manager_name','"lm_name','"marketMaker','"market_maker_name','tonbo-imaging-india-ltd-logo','acme','"nse_symbol','"nse_script','"symbol"']:
                  for m in list(re.finditer(re.escape(kw),h))[:1]:
                      note(f+" "+kw+": "+h[max(0,m.start()-200):m.start()+500])
              for m in list(re.finditer(r'https?://[^"\s]*logo[^"\s]*',h))[:3]:
                  note(f+" logo url: "+m.group(0))
          PY
