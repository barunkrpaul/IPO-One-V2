name: probe
on:
  push:
    branches: [ "claude/tmp-probe" ]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: fetch
        run: |
          UA="Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/129 Mobile Safari/537.36"
          get() { curl -sS -A "$UA" -H "Referer: https://www.investorgain.com/" -H "Accept: application/json" "$1"; }
          B=https://webnodejs.investorgain.com/cloud/v2
          get "$B/ipo/list-read" > list.json
          for u in "ipo/read/2369" "ipo/detail-read/2369" "ipo/2369" "ipo/data-read/2369" "ipo/details/2369"; do get "$B/$u" > "e_$(echo $u | tr / _).json"; done
          curl -sS -A "$UA" "https://www.investorgain.com/gmp/tonbo-imaging-india-ipo/2369/" > page.html
          python3 - <<'PY'
          import json,glob,re
          def note(t): print("::notice::"+t.replace("\n"," ")[:3900])
          try:
              d=json.load(open("list.json")); l=d.get("ipoList") or []
              note("list keys=%s n=%d item=%s"%(list(d.keys()),len(l),json.dumps(l[:1],ensure_ascii=False)))
          except Exception as e: note("list err "+open("list.json").read()[:300])
          for f in sorted(glob.glob("e_*.json")):
              note(f+" "+open(f).read()[:600])
          h=open("page.html").read()
          note("page len=%d"%len(h))
          for kw in ["registrar","Registrar","lead_manager","Lead Manager","market_maker","Market Maker","__NEXT_DATA__","buildId"]:
              for m in list(re.finditer(kw,h))[:2]:
                  note(kw+": "+h[max(0,m.start()-200):m.start()+400])
          PY
