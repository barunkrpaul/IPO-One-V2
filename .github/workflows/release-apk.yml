name: Build & Publish IPO One APK

on:
  push:
    branches: [ "main", "master" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Restore signing and Firebase config
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.b64 ]; then
            base64 -d debug.keystore.b64 > debug.keystore
          elif [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f app/google-services.json ] && [ -f app/google-services.json.b64 ]; then
            base64 -d app/google-services.json.b64 > app/google-services.json
          fi

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          # Optional: without this secret the release APK is signed with the debug key
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "::notice::Release key found; signing the release APK with it."
          else
            echo "::warning::No RELEASE_KEYSTORE_B64 secret; the release APK uses the debug key."
          fi

      - name: Show release certificate fingerprints
        if: env.RELEASE_KEYSTORE_PATH != ''
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          # Public fingerprints to register in Firebase (needed for Google Sign-In)
          keytool -list -v -keystore "$RELEASE_KEYSTORE_PATH" -alias "$RELEASE_KEY_ALIAS" -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            | grep -E "SHA1:|SHA256:" | sed 's/^[[:space:]]*/::notice::/'

      - name: Build Signed APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # On failure, repeat the key error lines as annotations so they show on the run summary
          gradle assembleDebug assembleRelease -x lint -x lintVitalRelease -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8" 2>&1 | tee build.log || {
            grep -E -A6 "^e: |What went wrong" build.log | grep -v "^--$" | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk IPO-One.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: IPO-One-APK
          path: |
            IPO-One.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: 'IPO One ${{ github.event.release.tag_name || github.ref_name }}'
          files: |
            IPO-One.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          body: 'Download IPO-One.apk (or app-release.apk / app-debug.apk) below and install it on your Android device.'
