name: probe
on:
  push:
    branches: [ "claude/tmp-probe" ]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: fetch
        run: |
          UA="Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/129 Mobile Safari/537.36"
          get() { curl -sS -A "$UA" -H "Referer: https://www.investorgain.com/" -H "Accept: application/json" "$1"; }
          for id in $(seq 200 319) $(seq 346 480); do get "https://webnodejs.investorgain.com/cloud/v2/report/data-read/$id/1/10/2026/2025-26/0/all?search=" > r$id.json; sleep 0.2
          done
          python3 - <<'PY'
          import json,glob,re
          out=[]
          for f in sorted(glob.glob("r*.json")):
              try:
                  d=json.load(open(f)); rows=d.get("reportTableData") or []
              except Exception:
                  continue
              if not rows: continue
              keys=[k for k in rows[0].keys() if not k.startswith("~")][:12]
              out.append("%s n=%s tot=%s keys=%s"%(f,len(rows),d.get("totalRecords"),keys))
          for k in range(0,len(out),3):
              print("::notice::"+" || ".join(out[k:k+3])[:3800])
          PY
