name: probe
on:
  push:
    branches: [ "claude/tmp-probe" ]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: registrars
        run: |
          UA="Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/129 Mobile Safari/537.36"
          i=0
          for u in https://kosmic.kfintech.com/ipostatus/ https://ipostatus.kfintech.com/ https://in.mpms.mufg.com/Initial_Offer/public-issues.html https://ipo.bigshareonline.com/IPO_Status.html https://ipo.cameoindia.com/ https://www.skylinerta.com/ipo.php https://maashitla.com/allotment-status/public-issues https://www.purvashare.com/investor-service/ipo-query https://ipostatus.integratedregistry.in/ https://www.masserv.com/opt.asp; do
            i=$((i+1)); code=$(curl -sSL -m 20 -A "$UA" -o r$i.html -w "%{http_code} %{url_effective}" "$u" 2>&1); echo "$u -> $code" > r$i.meta
          done
          python3 - <<'PY'
          import re,glob
          for f in sorted(glob.glob("r*.html"), key=lambda x:int(x[1:-5])):
              meta=open(f.replace(".html",".meta")).read().strip()
              h=open(f,errors="ignore").read()
              sel=re.findall(r'<select[^>]*>',h,re.I)[:3]
              inp=[m for m in re.findall(r'<input[^>]*>',h,re.I) if 'hidden' not in m.lower()][:10]
              btn=re.findall(r'<button[^>]*>[^<]{0,30}',h,re.I)[:4]
              cap=[k for k in ['captcha','recaptcha','hcaptcha','g-recaptcha'] if k in h.lower()]
              scripts=re.findall(r'<script[^>]+src="([^"]+)"',h,re.I)[:4]
              msg="%s len=%d captcha=%s selects=%s inputs=%s buttons=%s scripts=%s"%(meta,len(h),cap,sel,inp,btn,scripts)
              print("::notice::"+msg.replace("\n"," ")[:3900])
          PY
