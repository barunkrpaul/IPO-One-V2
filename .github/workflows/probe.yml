name: probe
on:
  push:
    branches: [ "claude/tmp-probe" ]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: fetch
        run: |
          UA="Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/129 Mobile Safari/537.36"
          get() { curl -sS -A "$UA" -H "Referer: https://www.investorgain.com/" -H "Accept: application/json" "$1"; }
          curl -sS -A "$UA" "https://www.investorgain.com/gmp/tonbo-imaging-india-ipo/2369/" > page.html
          curl -sS -A "$UA" "https://www.investorgain.com/gmp/acme-india-industries-ipo/2006/" > sme.html
          python3 - <<'PY'
          import re,json
          def note(t): print("::notice::"+t.replace("\n"," ")[:3900])
          for f in ["page.html","sme.html"]:
              h=open(f).read().replace('\\"','"')
              urls=sorted(set(re.findall(r'webnodejs[^"\s]{0,120}',h)))
              note(f+" api urls="+json.dumps(urls[:30]))
              i=h.find('"lead_managers"')
              if i>0:
                  st=h.rfind('{"',0,i-3000) if i>3000 else 0
                  blob=h[max(0,i-6000):i+6000]
                  keys=sorted(set(re.findall(r'"([a-zA-Z_]{3,40})":',blob)))
                  note(f+" keys near="+",".join(keys)[:3800])
              for kw in ['"lm_name"','"lead_manager_name"','"registrar_name"','"market_maker','logo_url','"company_logo','ipo_allotment_url','"lead_manager_list','"leadManagers','"registrar":{','"registrar_id"']:
                  m=h.find(kw)
                  if m>=0: note(f+" "+kw+": "+h[max(0,m-150):m+500])
          PY
