name: probe
on:
  push:
    branches: [ "claude/tmp-probe" ]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { java-version: '17', distribution: 'temurin' }
      - name: run parser
        run: |
          UA="Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/129 Mobile Safari/537.36"
          curl -sSL -o kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.10/kotlin-compiler-2.2.10.zip && unzip -q kc.zip
          curl -sSL -o json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          curl -sS -A "$UA" "https://www.investorgain.com/gmp/tonbo-imaging-india-ipo/2369/" > tonbo.html
          curl -sS -A "$UA" "https://www.investorgain.com/gmp/acme-india-industries-ipo/2006/" > acme.html
          curl -sS -A "$UA" "https://www.investorgain.com/gmp/bls-polymers-ipo/1849/" > bls.html
          kotlinc/bin/kotlinc -nowarn -cp json.jar probe/*.kt -d out
          java -cp out:json.jar:kotlinc/lib/kotlin-stdlib.jar MainKt tonbo.html acme.html bls.html
